<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .box {
          width: 100%;
          height: 200px;
          background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
          border-radius: 12px;
          position: relative;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-family: sans-serif;
          font-size: 28px;
          font-weight: bold;
        }
        .snowflake {
          position: absolute;
          top: -20px;
          color: #ffffff;
          user-select: none;
          animation: fall linear infinite;
        }
        @keyframes fall {
          0% { transform: translateY(-20px); opacity: 1; }
          100% { transform: translateY(220px); opacity: 0.2; }
        }
        .s1 { left: 10%; font-size: 16px; animation-duration: 4s; animation-delay: 0s; }
        .s2 { left: 25%; font-size: 22px; animation-duration: 6s; animation-delay: 1s; }
        .s3 { left: 40%; font-size: 14px; animation-duration: 5s; animation-delay: 2s; }
        .s4 { left: 55%; font-size: 20px; animation-duration: 7s; animation-delay: 0.5s; }
        .s5 { left: 70%; font-size: 18px; animation-duration: 4.5s; animation-delay: 1.5s; }
        .s6 { left: 85%; font-size: 24px; animation-duration: 5.5s; animation-delay: 0.2s; }
        .s7 { left: 93%; font-size: 15px; animation-duration: 6.5s; animation-delay: 2.5s; }
      </style>
      <div class="box">
        Привет! Добро пожаловать в мой профиль ❄️
        <div class="snowflake s1">❄</div>
        <div class="snowflake s2">❅</div>
        <div class="snowflake s3">❆</div>
        <div class="snowflake s4">❄</div>
        <div class="snowflake s5">❅</div>
        <div class="snowflake s6">❆</div>
        <div class="snowflake s7">❄</div>
      </div>
    </div>
  </foreignObject>
</svg>
