      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" rx="12" fill="url(#bg)"/>

  <text x="400" y="108" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">
