  </text>
  <text x="180" y="-10" fill="#ffffff" font-size="22" opacity="0.8">❅
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 230" dur="6s" begin="1s" repeatCount="indefinite"/>
  </text>
  <text x="290" y="-10" fill="#ffffff" font-size="16" opacity="0.9">❆
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 230" dur="5s" begin="2s" repeatCount="indefinite"/>
  </text>
  <text x="420" y="-10" fill="#ffffff" font-size="20">❄
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 230" dur="7s" begin="0.5s" repeatCount="indefinite"/>
  </text>
  <text x="540" y="-10" fill="#ffffff" font-size="18" opacity="0.85">❅
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 230" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
  </text>
  <text x="650" y="-10" fill="#ffffff" font-size="24">❆
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 230" dur="5.5s" begin="0.2s" repeatCount="indefinite"/>
  </text>
  <text x="740" y="-10" fill="#ffffff" font-size="16" opacity="0.9">❄
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 230" dur="6.5s" begin="2.5s" repeatCount="indefinite"/>
  </text>
